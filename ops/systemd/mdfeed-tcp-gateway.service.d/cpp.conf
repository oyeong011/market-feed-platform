# C++ 배포 게이트웨이로 바꿔 끼우는 드롭인.
#
#   install -D ops/systemd/mdfeed-tcp-gateway.service.d/cpp.conf \
#     /etc/systemd/system/mdfeed-tcp-gateway.service.d/cpp.conf
#   systemctl daemon-reload && systemctl restart mdfeed-tcp-gateway
#
# 유닛 본문(재시작 정책·격리·순서)은 그대로 쓰고 실행 파일만 바꾼다. 유닛을 복제하면
# 한쪽만 고치는 사고가 난다. 되돌리려면 이 파일만 지우면 된다.
#
# 배선 규약이 같으므로 참조 클라이언트·부하 도구·healthcheck.py 는 그대로 붙는다.
# /healthz 의 "impl" 이 "c++" 인지로 실제 무엇이 도는지 확인한다.
[Service]
ExecStart=
ExecStart=/opt/mdfeed/cpp/build/tcp_gateway
# 인터프리터가 없으므로 파이썬 환경변수는 의미가 없다. 설정은 EnvironmentFile 로 들어온다.
Environment=MDFEED_GATEWAY_IMPL=cpp
