# /etc/logrotate.d/mdfeed
# journald 를 쓰면 필요 없지만, 파일 로깅으로 전환한 경우를 위한 설정.
/var/log/mdfeed/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 mdfeed mdfeed
    sharedscripts
    postrotate
        # SIGHUP 은 runtime.py 에서 로그 레벨 재적용 훅으로 잡아 둔다.
        # 프로세스를 재시작하지 않고 로테이션을 마칠 수 있다.
        systemctl kill -s HUP mdfeed.target 2>/dev/null || true
    endscript
}
