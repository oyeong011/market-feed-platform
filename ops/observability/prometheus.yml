# Prometheus 수집 설정.
#
# 서비스마다 자기 /metrics 를 따로 노출한다. 하나로 모으지 않는 이유는
# "어느 프로세스가 아픈지" 를 구분하기 위해서다 — 합쳐 놓으면 지표가 튈 때
# 어디서 튀는지 알 수 없다.
#
# 샤드도 따로 잡는다. feedd:crypto 와 feedd:krx 는 다른 프로세스이고
# 다른 이유로 아플 수 있다.

global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    platform: mdfeed

rule_files:
  - /etc/prometheus/alerts.yml

# **알람을 보낼 곳.** 이 절이 없으면 규칙은 Prometheus 안에서 firing 이 되고 거기서
# 끝난다. UI 를 열어 보는 사람이 없으면 아무 일도 안 일어난다 — 규칙 48개가 그 상태로
# 있었다(결함 51). 규칙 파일 머리의 "울리면 사람이 할 일이 있어야 한다" 는 전달
# 경로가 있어야 성립한다.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mdfeed
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels: { service: feedd, shard: crypto }
      - targets: ["host.docker.internal:9200"]
        labels: { service: feedd, shard: krx }
      - targets: ["host.docker.internal:9111"]
        labels: { service: tcp-gateway }
      - targets: ["host.docker.internal:9102"]
        labels: { service: ws-gateway }
      - targets: ["host.docker.internal:9103"]
        labels: { service: rest-api }
      - targets: ["host.docker.internal:9104"]
        labels: { service: writer }
      - targets: ["host.docker.internal:9105"]
        labels: { service: strategy }
      - targets: ["host.docker.internal:9106"]
        labels: { service: quality }
      - targets: ["host.docker.internal:9120"]
        labels: { service: preflight-monitor }
      # 멀티캐스트 발행자는 선택 서비스다. 안 켠 구성에서는 이 타깃이 down 으로 남는데,
      # up{} 알람이 그걸 잡지 않도록 아래 알람들은 지표 존재를 전제로만 판정한다.
      - targets: ["host.docker.internal:9132"]
        labels: { service: mcast-publisher }

  # **알람을 보내는 쪽도 감시한다.** Alertmanager 가 죽으면 알람이 안 오는데, 그 사실을
  # 알려 줄 수 있는 건 Alertmanager 가 아니다. 그래서 Prometheus 가 직접 긁는다.
  - job_name: alertmanager
    metrics_path: /metrics
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: { service: alertmanager }

  - job_name: alert-sink
    metrics_path: /metrics
    static_configs:
      - targets: ["alert-sink:9140"]
        labels: { service: alert-sink }
