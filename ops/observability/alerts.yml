# 알람 규칙.
#
# 규칙을 쓸 때 지킨 원칙 두 가지.
#
# 1. **울리면 사람이 할 일이 있어야 한다.** 보고 넘길 알람은 알람이 아니라
#    대시보드 항목이다. 그래서 각 규칙에 무엇을 하라는 문장을 붙였다.
# 2. **for 를 넉넉히 준다.** 순간적인 튐으로 울리면 사람이 알람을 무시하게 되고,
#    그러면 진짜가 왔을 때도 무시한다. 품질 검사기의 오탐 문제와 같다.

groups:
  - name: mdfeed-availability
    rules:
      - alert: ServiceDown
        expr: up{job="mdfeed"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} 응답 없음"
          action: "systemctl status mdfeed-{{ $labels.service }} · journalctl -u 로 원인 확인"

      - alert: UpstreamStale
        # 프로세스는 멀쩡한데 데이터만 안 오는 상태. systemd 가 못 잡는 종류다.
        expr: mdfeed_upstream_stale > 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.venue }} 업스트림 정체 3분 이상"
          action: "RUNBOOK 증상 1. 어댑터가 스스로 재접속할 시간을 준 뒤에도 지속되면 재시작"

      # 크립토는 24시간 돌아간다. 여기서 0 이면 무조건 이상이다.
      - alert: CryptoFeedThroughputZero
        expr: rate(mdfeed_published_total{shard="crypto"}[5m]) == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "크립토 발행량 0 (5분)"
          action: "24시간 시장이므로 정상 사유가 없다. RUNBOOK 증상 1"

      # 국내 시장은 장 마감 후 발행량이 0 인 것이 정상이다.
      # 이 조건을 안 넣으면 매일 밤 알람이 울리고, 그러면 사람이 이 알람을
      # 무시하게 되어 진짜 장애가 나도 못 본다.
      - alert: KrxFeedThroughputZeroDuringMarketHours
        expr: |
          rate(mdfeed_published_total{shard="krx"}[5m]) == 0
          and on() (max(mdfeed_market_open) == 1)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "장중인데 국내 발행량 0 (5분)"
          action: "휴장일 캘린더 확인 후 RUNBOOK 증상 1"

  - name: mdfeed-quality
    rules:
      - alert: DataQualityCritical
        # 이 값을 쓰면 안 된다는 판정. 조용히 틀린 값이 나가는 것을 막는 마지막 선.
        expr: increase(mdfeed_quality_events_total{severity="CRITICAL"}[10m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.check }} CRITICAL 탐지"
          action: "curl :9106/events 로 상세 확인. 파싱 오류면 해당 어댑터 즉시 점검"

      - alert: SequenceGaps
        expr: increase(mdfeed_gap_messages_total[10m]) > 100
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "10분간 시퀀스 유실 {{ $value }}건"
          action: "RUNBOOK 증상 2. 특정 구독자만인지 전체인지 :9111/subscribers 로 확인"

      - alert: ClockSkewHigh
        # 시계가 어긋나면 지연 지표 전체를 믿을 수 없게 된다
        expr: abs(mdfeed_clock_offset_us) > 100000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.venue }} 시계 오프셋 {{ $value }}µs"
          action: "timedatectl status 로 NTP 동기화 확인. 서비스는 계속 동작하나 지연 지표 신뢰도 저하"

  - name: mdfeed-resources
    rules:
      - alert: MemoryLeak
        # 누수는 천천히 자라다가 새벽에 터진다. 기울기로 미리 잡는다.
        # 프로세스가 15분 미만이면 기울기를 0 으로 보고하므로(procstat.MIN_TRACK_S)
        # 기동 직후 노이즈로 울리지 않는다.
        expr: mdfeed_process_rss_growth_mb_per_hour > 5
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} RSS {{ $value }}MB/h 증가"
          action: "하루면 120MB. 심볼 캐시·구독자 큐가 안 줄어드는지 확인"

      - alert: FdLeak
        expr: mdfeed_process_fd_growth_per_hour > 1
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} fd {{ $value }}개/h 증가"
          action: "소켓 close 누락 의심. 결국 EMFILE 로 죽는다"

      - alert: FdNearLimit
        expr: mdfeed_process_fd_open / mdfeed_process_fd_limit > 0.8
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} fd 한도 80% 도달"
          action: "LimitNOFILE 상향 또는 구독자 수 제한"

  - name: mdfeed-distribution
    rules:
      - alert: SubscriberDrops
        expr: increase(mdfeed_dropped_total[5m]) > 1000
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "구독자 드롭 {{ $value }}건 (5분)"
          action: "느린 구독자 격리가 동작 중. :9111/subscribers 에서 어느 구독자인지 확인"

      - alert: IngestLatencyHigh
        # venue 라벨이 붙은 계열만 본다. 합산 계열(venue 없음)도 같이 매칭되면
        # 같은 문구가 업스트림 수 + 1 번 울린다. 그리고 합산으로는 어차피
        # 어느 업스트림 탓인지 몰라 조치할 수 없다.
        expr: mdfeed_ingest_latency_microseconds{quantile="p99", venue!=""} > 1000000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.venue }} 수집 지연 p99 {{ $value }}µs"
          action: "다른 venue 도 같이 높으면 우리 쪽, 하나만 높으면 그 거래소 쪽.
            구독 직후 스냅샷은 지연에서 빠져 있으므로(snapshot_msgs_total) 실제 지연이다"

  # ── 조용히 멎는 실패 ──────────────────────────────────────────────────
  # 2026-08-28 장중 운전에서 실제로 겪은 것들이다. 지표는 그때 만들었는데
  # 알람을 안 걸어 뒀다. 지표만 있고 알람이 없으면 사람이 대시보드를 열어
  # 볼 때만 보인다 — 이 프로젝트가 계속 마주친 "조용히 틀린" 실패다.
  - name: mdfeed-silent-failures
    rules:
      - alert: AdapterTaskDied
        # 어댑터 루프가 예외로 끝나면 태스크만 사라지고 서비스는 healthy 를
        # 계속 보고한다. 실측: upbit 이 2.97시간 멎었는데 재접속은 8회에서
        # 멈춰 있었다. 이제 되살리지만, 되살아난 사실 자체가 조사할 신호다.
        expr: increase(mdfeed_adapter_task_deaths_total[15m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.venue }} 어댑터 루프가 죽어 재기동됨 ({{ $value }}회/15분)"
          action: "journalctl 에서 '어댑터 루프가 죽었다' 스택트레이스를 볼 것.
            되살리기는 임시 조치이고 예외 자체를 고쳐야 한다"

      - alert: SessionCancelTimeout
        # 취소한 세션의 정리가 안 끝나 버린 경우. 이제 버리고 재접속하므로
        # 시세는 돌아오지만, 태스크 하나가 프로세스에 남는다.
        # 실측(2026-08-29): 이 대기에 기한이 없던 시절 upbit 이 11.2시간
        # 멎었다. 감시·지표·경보는 다 돌았고 복구만 안 됐다.
        expr: increase(mdfeed_session_cancel_timeouts_total[30m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.venue }} 세션 정리가 안 끝나 버려짐 ({{ $value }}회/30분)"
          action: "해당 어댑터의 session() finally 에서 기한 없는 await 를 찾을 것.
            반복되면 프로세스에 태스크가 쌓이므로 rss 와 fd 를 같이 볼 것"

      - alert: ReconnectStorm
        # 정체를 못 잡는 것과 반대 방향의 실패: 멀쩡한데 계속 끊는 경우.
        # 실측: 휴장 중 워치독이 조용함을 고장으로 읽어 시간당 18회 재접속했다.
        # 증권사 API 는 이런 패턴에서 키 단위로 차단할 수 있다.
        expr: increase(mdfeed_reconnects_total[1h]) > 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.venue }} 재접속 {{ $value }}회/시간 — 복구가 아니라 증상"
          action: "정체 판정이 맞는지 본다. /healthz 의 expects_data 가 false 면
            휴장인데 감시가 도는 것이다. 브로커 차단 전에 멈춰야 한다"

      - alert: SymbolCollision
        # 잘림은 정보 손실이고, **충돌은 데이터 오염**이다. 심각도가 다르다.
        # 실측(2026-08-28): '코스피 대형주'와 '코스피 중형주'가 같은 바이트가 되어
        # 두 지수 가격이 한 계열로 섞였고 "한 틱에 709.73% 이동" CRITICAL 이
        # 2,262건 쌓였다. SymbolTruncated 만으로는 "잘리고는 있는데 해가 있나?"
        # 에 답할 수 없다.
        expr: mdfeed_symbol_collision_kinds > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "심볼이 잘린 뒤 서로 겹쳤다 ({{ $value }}종) — 하류가 두 종목을 하나로 본다"
          action: ":9100/symbols/truncated 의 collisions 를 볼 것.
            전송 심볼 폭을 넓히려면 프로토콜 버전 올림이 필요하다"

      - alert: SymbolTruncated
        # 심볼이 전송 폭을 넘으면 잘린다. 서로 다른 두 종목이 같은 바이트로
        # 잘리면 하류에서 한 계열로 섞이고, 품질 검사가 거짓 급등으로 잡는다.
        # 실측: KRX 지수명이 전부 빈 문자열이 돼 CRITICAL 2,262건이 났다.
        expr: mdfeed_symbol_truncated_kinds > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "심볼 {{ $value }}종이 전송 폭(16바이트)에서 잘리는 중"
          action: ":9100/symbols/truncated 로 어느 심볼인지 확인.
            잘린 이름이 서로 겹치면 데이터가 섞이는 중이므로 즉시 조치"

  # ── 용량 ──────────────────────────────────────────────────────────────
  - name: mdfeed-capacity
    rules:
      - alert: DiskFillingSoon
        # 남은 GB 가 아니라 남은 시간으로 건다. 40GB 남았다는 게 하루치인지
        # 한 달치인지는 유량을 모르면 해석할 수 없다.
        # 실측: 688종목에서 하루 약 2,460만 행이 쌓인다.
        # disk_hours_until_full 은 증가율이 0 이면 계산되지 않아 지표가 사라진다.
        # 알람은 항상 존재하는 지표 위에 세워야 평가가 끊기지 않는다.
        expr: mdfeed_disk_free_bytes / mdfeed_db_growth_bytes_per_hour < 24
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "디스크가 약 {{ $value }}시간 뒤에 찬다"
          action: "MDFEED_RETENTION_DAYS 를 켜거나 줄인다. 봉과 품질 이벤트는
            보존되고 원시 체결·호가만 지워진다"

      - alert: RetentionNotRunning
        # 보존을 켜 뒀는데 아무것도 안 지워지면 정책이 안 도는 것이다.
        # 디스크가 차기 전엔 티가 안 난다.
        expr: mdfeed_disk_free_bytes / mdfeed_db_growth_bytes_per_hour < 72
          and increase(mdfeed_rows_pruned_total[6h]) == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "디스크가 {{ $value }}시간 남았는데 6시간째 삭제된 행이 없다"

      - alert: RetentionFallingBehind
        # "지운다"와 "다 지웠다"는 다르다. 삭제가 시간 예산에 걸려 매번
        # 남기고 돌아오면 rows_pruned_total 은 계속 늘어서 위 알람은 안 뜬다.
        # 그런데도 유입을 못 따라가고 있으면 디스크는 계속 찬다.
        # 첫 삭제 직후 잠깐 1 인 건 정상이라 2시간을 본다
        # (실측 0.63초/배치·예산 30초·주기 60초면 첫 삭제 557배치가 12분).
        expr: min_over_time(mdfeed_retention_prune_incomplete[2h]) == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "보존 삭제가 2시간째 한 번도 다 못 끝냈다"
          action: "RETENTION_DAYS 를 더 줄이거나 RETENTION_BUDGET_S 를 올린다.
            삭제 속도가 적재 속도를 못 따라가고 있다"

      - alert: ArchiveFailing
        # 아카이브가 막히면 삭제도 그 앞에서 멈춘다(설계대로다). 그래서
        # 디스크는 계속 차는데 "보존이 안 돈다"로만 보인다. 원인은 여기다.
        expr: mdfeed_archive_failed_segments > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "아카이브 조각 {{ $value }}개가 30분째 실패 중"
          action: "writer /healthz 의 storage.archive_failed 를 본다.
            목적지 경로가 살아 있는지(마운트 해제·용량 초과) 확인한다.
            아카이브가 막히면 삭제도 멈추므로 디스크가 먼저 찬다"

      - alert: ArchiveStalled
        # 아카이브를 켰는데(archive_enabled=1) 하루가 지나도록 한 행도
        # 안 올라갔다. 켠 줄 알고 지우기를 기다리는 동안 디스크가 찬다.
        # "켰다"와 "돈다"는 다르다 — 이 프로젝트에서 네 번 겪은 구분이다.
        expr: mdfeed_archive_enabled == 1
          and increase(mdfeed_rows_archived_total[24h]) == 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "아카이브를 켰는데 24시간째 올라간 행이 0이다"
          action: "MDFEED_ARCHIVE_DIR 경로가 쓰기 가능한지,
            아직 끝난 날이 없는 건 아닌지(ARCHIVE_LAG_S) 확인한다"
          action: "writer 의 MDFEED_RETENTION_DAYS 가 0 이면 꺼져 있는 것이다.
            켜져 있는데도 0 이면 journalctl 에서 '[retention]' 를 볼 것"

      - alert: MarketDataGapOpen
        expr: mdfeed_data_gaps_open > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "마켓데이터 공백 {{ $value }}개가 아직 복구되지 않았다"
          action: "mdfeed gap status 로 시작·범위·차단 사유를 확인한다.
            서비스 health와 별개로 과거 데이터 완전성은 불완전하다"

      - alert: MarketDataGapUnrecoveredTooLong
        expr: mdfeed_data_gaps_unrecovered_duration_seconds > 3600
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "복구되지 않은 마켓데이터 공백이 1시간을 넘었다"
          action: "저장된 backfill/reconciliation 증거가 없으면 복구로 표시하지 않는다"

      - alert: MarketDataGapRecoveryVerificationFailed
        expr: increase(mdfeed_gap_recovery_verification_failures_total[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "마켓데이터 공백 복구 검증이 실패했다"
          action: "receipt 범위, missing rows/intervals, authoritative coverage id를 확인한다"

  - name: mdfeed-storage-operations
    rules:
      - alert: StorageBackendMismatch
        expr: mdfeed_storage_backend_mismatch > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "저장소 백엔드가 배포 정책과 다르다"
          action: "ops/preflight.py --json 결과와 서비스 EnvironmentFile 을 비교한다"

      - alert: StorageDatabaseUnavailable
        expr: mdfeed_storage_db_unavailable > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL 저장소 연결 또는 스키마 검증 실패"
          action: "runtime role, CA, sslmode=verify-full, schema validate-only 결과를 확인한다"

      - alert: WriterPendingRowsOverflow
        expr: mdfeed_writer_pending_rows > 90000
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "writer 미확정 버퍼가 한계에 가깝다"
          action: "DB 장애 여부와 in-flight receipt 재시도 상태를 확인한다"

      - alert: WriterPendingRowsUnknown
        expr: mdfeed_writer_pending_rows < 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "writer 미확정 버퍼 크기를 확인할 수 없다"
          action: "writer /metrics 수집과 preflight-monitor 상태를 확인한다"

      # ── 배포단: C++ 게이트웨이 · 멀티캐스트 ───────────────────────────────
      # 이 서비스들이 내는 지표를 보는 알람이 한동안 하나도 없었다. 새 서비스를 붙이면서
      # 알람을 안 붙이면 "지표는 있는데 아무도 안 본다"가 된다 — 이 저장소가 반대 방향
      # (알람은 있는데 지표가 없다)으로 겪은 것과 같은 사각이다.

      - alert: McastSendErrors
        # sendto 가 실패하면 프로세스는 멀쩡히 살아 있는데 아무도 데이터를 못 받는다.
        # 망 설정(송신 인터페이스·IGMP·방화벽)이 안 맞을 때 나는 가장 조용한 장애다.
        expr: increase(mdfeed_mcast_send_errors_total[5m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "멀티캐스트 전송이 실패하고 있다 — 발행 중인데 아무도 못 받는 상태"
          action: "MDFEED_MCAST_IF 로 송신 인터페이스를 지정했는지, 그룹·방화벽·IGMP 를 확인한다"

      - alert: McastRetransUnavailable
        # 재전송 버퍼 밖으로 밀린 구간. 구독자가 영구히 못 받는 데이터다.
        expr: increase(mdfeed_mcast_retrans_unavailable_total[10m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "재전송 버퍼 밖 구간 요청 — 구독자가 복구할 수 없는 공백이 생겼다"
          action: "MDFEED_MCAST_RETRANS_BUFFER 를 늘리거나 구독자 지연 원인을 찾는다. 구독자는 스냅샷 재동기화가 필요하다"

      - alert: McastRetransStorm
        # 유실이 늘면 재전송 요청도 는다. 복구 채널이 TCP 이므로 폭증하면 그쪽이 병목이 된다.
        expr: increase(mdfeed_mcast_retrans_requests_total[5m]) > 500
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "재전송 요청이 폭증한다 — 망 유실이 심하거나 갭필 지연이 안 먹는다"
          action: "스위치 큐·IGMP 스누핑과 구독자의 gap_fill_delay 설정을 본다"

      - alert: McastFaultInjectionEnabled
        # 시험용 주입이 운영에 켜져 있으면 일부러 데이터를 버리고 있는 것이다.
        expr: increase(mdfeed_mcast_injected_drops_total[5m]) > 0
            or increase(mdfeed_mcast_injected_reorders_total[5m]) > 0
            or increase(mdfeed_mcast_injected_duplicates_total[5m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "결함 주입이 켜진 채 돌고 있다 — 일부러 데이터를 버리는 중"
          action: "MDFEED_MCAST_DROP_EVERY / REORDER_EVERY / DUPLICATE_EVERY 를 끄고 재기동한다"

      - alert: EntitlementDenialSpike
        # 권한 거절이 갑자기 늘면 둘 중 하나다: 권한 파일과 실제 구독 설정이 어긋났거나,
        # 권한 없는 쪽이 계속 두드리고 있거나. 둘 다 사람이 봐야 한다.
        expr: increase(mdfeed_entitlement_denied_total[10m]) > 50
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "구독 권한 거절이 급증했다"
          action: "게이트웨이 로그의 거절 사유(TOKEN_REQUIRED/UNKNOWN_TOKEN/NOT_ENTITLED)와 권한 파일을 대조한다"

      - alert: FanoutUnfair
        # 순차 팬아웃을 늘 같은 순서로 돌면 접속이 이른 구독자가 구조적으로 유리해진다.
        # 실측(구독자 100명): 고정 순서 62배, 시작점 회전 1.0배. 같은 값을 파는 피드에서
        # 접속 순서가 지연 우선순위를 정하면 안 된다. 회귀하면 이 값이 먼저 올라간다.
        expr: mdfeed_fanout_delay_spread > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "구독자 사이 팬아웃 지연이 기울었다 — 접속 순서가 유불리를 만들고 있다"
          action: "/subscribers 의 mean_send_delay_us 를 id 순으로 보고, 팬아웃 순회가 회전하는지 확인한다"

      - alert: GatewaySendBackpressure
        # send() 가 EAGAIN 으로 돌아오면 커널 송신 버퍼가 찼다는 뜻이다. 구독자가 못 따라오고 있고,
        # 이 상태가 길어지면 우리 큐가 차서 드롭으로 넘어간다. 드롭보다 먼저 보이는 신호다.
        expr: increase(mdfeed_send_eagain_total[5m]) > 1000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "배포 게이트웨이 송신이 커널 버퍼에서 막히고 있다"
          action: "/subscribers 의 wire_bytes 로 느린 구독자를 지목하고, 필요하면 conflate 모드를 권한다"

      - alert: VerifiedBackupStale
        expr: mdfeed_backup_last_verified_age_seconds > 93600
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "원격 fetch 검증을 통과한 백업이 26시간 넘게 없다"
          action: "mdfeed-backup.timer 와 원격 push/fetch receipt 를 확인한다"

      - alert: RestoreDrillStale
        expr: mdfeed_restore_drill_last_verified_age_seconds > 691200
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "복구 드릴 검증이 8일 넘게 오래됐다"
          action: "mdfeed-restore-drill.timer 와 backup_restore_receipts 를 확인한다"

      - alert: RetentionRemoteCoverageBlocked
        expr: mdfeed_retention_remote_coverage_blocked > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "보존 삭제가 원격 검증 증거 부족으로 막혔다"
          action: "trades/book_top 일별 fetch-back receipt 의 첫 누락 날짜를 확인한다"

      - alert: DeploymentGapsOpen
        expr: mdfeed_deployment_gaps_open > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "배포 전 점검에서 미복구 데이터 공백이 확인됐다"
          action: "preflight JSON 의 OPEN_DATA_GAPS 항목과 mdfeed gap status 를 확인한다"
