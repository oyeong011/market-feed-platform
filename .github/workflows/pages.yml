name: Pages

# docs/ 를 GitHub Pages 로 배포한다.
# 대시보드가 읽는 지표 JSON 은 CI 가 매번 새로 만들어 넣는다 —
# 사람이 수치를 옮겨 적으면 문서와 실제가 갈라지기 때문이다.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"    # 매일 06:00 KST 지표 갱신
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: 교차검증 라이브러리 설치
        # 핵심 경로에는 필요 없지만, 대시보드에 실제 교차검증 수치를 실으려면 필요하다.
        # 설치가 실패해도 백테스트는 자체 엔진으로 계속 돌아간다.
        run: pip install pandas backtesting || echo "교차검증 없이 진행"

      - name: 벤치마크 실행 → docs/data/bench.json
        run: python bench/latency_bench.py --out docs/data/bench.json
        env: { PYTHONPATH: src }

      - name: 오프라인 리플레이로 파이프라인 검증 데이터 생성
        run: |
          mkdir -p data
          MDFEED_ADAPTERS=replay MDFEED_REPLAY_SPEED=0 MDFEED_REPLAY_LOOP=0 \
          MDFEED_RUN_DIR=/tmp/mdfeed MDFEED_BAR_INTERVAL_S=60 \
          MDFEED_STORAGE_BACKEND=sqlite MDFEED_STORAGE_PROFILE=test \
          MDFEED_SQLITE_PATH=/tmp/mdfeed/pages.db \
          PYTHONPATH=src python -m mdfeed.cli up --only feedd writer > /tmp/s.log 2>&1 &
          sleep 25
          pkill -f "mdfeed.cli up" || true
          sleep 8

      - name: 백테스트 → docs/data/backtest.json
        run: |
          python quant/run_backtest.py --source replay \
            --symbol KIS:005930 --interval 10 --cross-check \
            --out docs/data/backtest.json || echo "봉 부족 — 건너뜀"
        env: { PYTHONPATH: src }

      - name: 재무 팩터 스크리닝 → docs/data/factors.json
        run: |
          python quant/factor_screen.py --market dart --top 20 \
            --out docs/data/factors.json || echo "참조 데이터 미확보 — 건너뜀"
        env: { PYTHONPATH: src }

      - name: 품질 검사 스냅샷 → docs/data/quality.json
        run: python scripts/capture_quality.py --out docs/data/quality.json
        env: { PYTHONPATH: src }

      - name: 빌드 메타 기록
        run: |
          python - <<'PY'
          import json, subprocess, time, os
          os.makedirs("docs/data", exist_ok=True)
          sha = subprocess.check_output(["git","rev-parse","--short","HEAD"]).decode().strip()
          json.dump({"commit": sha,
                     "built_at": time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime()),
                     "repo": os.getenv("GITHUB_REPOSITORY","")},
                    open("docs/data/build.json","w"), ensure_ascii=False, indent=1)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 한 번 실패하면 다시 시도한다. 2026-10-03 야간 실행이 GitHub 쪽 OIDC 토큰
      # 타임아웃("Request timeout: /idtoken/…")으로 떨어졌다 — 설정 문제가 아니라
      # 일시 오류이고, 앞 5일은 같은 권한으로 성공했다.
      #
      # 문제는 실패 자체가 아니라 **아무도 모른다는 것**이다. 야간 배포가 조용히
      # 떨어지면 공개 페이지가 낡은 숫자를 계속 보여 준다. 재시도로 일시 오류를
      # 흡수하고, 그래도 실패하면 아래에서 사람이 볼 수 있게 남긴다.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: 재시도로 살아난 경우를 기록한다
        # 재시도가 매번 필요해지면 일시 오류가 아니라 구조 문제다. 그 전환을
        # 보이게 해 둔다 — 재시도가 성공을 가려 주면 악화를 눈치채지 못한다.
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::첫 배포가 실패하고 재시도로 성공했다. 반복되면 일시 오류가 아니다."
          {
            echo "### Pages 배포 재시도"
            echo "첫 시도 실패 → 재시도 성공. 이 줄이 자주 보이면 원인을 찾아야 한다."
          } >> "$GITHUB_STEP_SUMMARY"
