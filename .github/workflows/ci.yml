name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 의존성 설치
        # 핵심 경로는 표준 라이브러리만 쓴다. 테스트 러너와 async 플러그인만 설치한다.
        # 핵심 경로는 표준 라이브러리만 쓰지만, 테스트는 로컬 개발 환경과 같은 조건으로 돈다.
        # 드라이버 없이 돌리면 백업 CLI·preflight 가 다른 오류 경로로 빠져 세 시험이 실패했다 (CI 두 번째 실행).
        # 드라이버 없는 조건은 스모크·컨테이너 잡이 따로 검증한다.
        run: pip install pytest pytest-asyncio 'psycopg2-binary>=2.9'

      - name: 문법·임포트 점검
        run: make lint

      - name: 테스트
        # 리플레이 어댑터를 쓰므로 거래소 접속 없이 전 구간이 검증된다
        run: python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: src
          MDFEED_STORAGE_BACKEND: sqlite
          MDFEED_STORAGE_PROFILE: test
          MDFEED_SQLITE_PATH: /tmp/mdfeed-test-${{ matrix.python }}.db
          MDFEED_ADAPTERS: replay

  smoke:
    name: 스택 스모크 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: 오프라인 리플레이로 전체 스택 기동
        run: |
          mkdir -p data/replay
          test -f data/replay/sample.mdf || { echo "녹화 파일 없음"; exit 1; }
          MDFEED_ADAPTERS=replay MDFEED_REPLAY_LOOP=1 \
          MDFEED_RUN_DIR=/tmp/mdfeed \
          MDFEED_STORAGE_BACKEND=sqlite MDFEED_STORAGE_PROFILE=test \
          MDFEED_SQLITE_PATH=/tmp/mdfeed/smoke.db \
          PYTHONPATH=src python -m mdfeed.cli up > /tmp/stack.log 2>&1 &
          echo $! > /tmp/sup.pid
          # 배포 게이트 익스포터도 같이 띄운다. 알람 7종이 이 지표를 참조하는데, 안 띄우면
          # 검증이 "영원히 안 울린다" 로 떨어진다 (첫 CI 실행에서 실제로 그랬다).
          PYTHONPATH=src python ops/preflight_monitor.py --config ops/mdfeed.env.example \
            --port 9120 > /tmp/preflight.log 2>&1 &
          sleep 15

      - name: 헬스체크 (CRIT 이면 실패, WARN 은 통과)
        # WARN 은 "저하됐지만 서비스 중"이다. CI 러너의 시계 상태 같은 환경 요인으로
        # WARN 이 뜰 수 있으므로, 실제 장애(CRIT)만 빌드를 실패시킨다.
        run: |
          set +e
          PYTHONPATH=src python ops/healthcheck.py
          rc=$?
          set -e
          echo "healthcheck exit=$rc (0=OK 1=WARN 2=CRIT)"
          [ "$rc" -ge 2 ] && exit 1
          exit 0

      - name: 참조 클라이언트로 실제 구독 검증
        run: |
          PYTHONPATH=src timeout 30 python -m mdfeed.cli client \
            --duration 10 --quiet | tee /tmp/client.log
          # 시퀀스 유실이 있으면 실패시킨다. 배포단 회귀를 잡는 최후 방어선.
          grep -q "데이터 무결성: 100" /tmp/client.log || {
            echo "::error::구독자 데이터 무결성 100% 미달"; cat /tmp/client.log; exit 1; }

      - name: 받아 놓고 안 쓰는 인자 검증
        # PriceJumpCheck 가 ts_ns 를 받아 놓고 간격 판정에 안 써서
        # "한 틱에 30% 이동"이 사실은 11시간 만의 첫 틱이었다(2026-08-29).
        # 인자를 받는다는 건 그 값이 판단에 필요하다는 선언이다.
        run: PYTHONPATH=src python scripts/find_unused_params.py --check

      - name: 알람이 실재하는 지표를 참조하는지 검증
        # 존재하지 않는 지표를 참조하는 알람은 영원히 울리지 않는데
        # Prometheus 는 오류를 내지 않는다. 여기서 잡는다.
        run: PYTHONPATH=src python scripts/verify_alerts.py

      - name: 장애 주입 — 복구 경로 검증
        run: bash ops/chaos.sh corrupt

      - name: REST API 확인
        run: |
          curl -sf localhost:9103/api/v1/stats | python3 -m json.tool
          curl -sf localhost:9100/metrics | head -20

      - name: 우아한 종료 확인 (SIGTERM 이후 프로세스가 남지 않아야 함)
        run: |
          kill "$(cat /tmp/sup.pid)"
          sleep 12
          if pgrep -f "mdfeed.services" > /dev/null; then
            echo "::error::SIGTERM 후에도 프로세스가 살아있음"; pgrep -af "mdfeed.services"; exit 1
          fi
          echo "정상 종료 확인"

      - name: 실패 시 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs
          path: /tmp/*.log

  smoke-cpp:
    name: 스택 스모크 (C++ 게이트웨이)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the C++ data plane
        run: make -C cpp -s all

      - name: 같은 스택을 C++ 배포 게이트웨이로 기동
        # 드롭인 교체가 실제로 되는지 본다. 배선 규약이 같으므로 파이썬 참조 클라이언트와
        # healthcheck.py 가 그대로 붙어야 한다 — 안 붙으면 "바꿔 낄 수 있다"는 말이 거짓이다.
        run: |
          mkdir -p data/replay
          MDFEED_GATEWAY_IMPL=cpp \
          MDFEED_MCAST_ENABLED=1 MDFEED_MCAST_IF=127.0.0.1 \
          MDFEED_ADAPTERS=replay MDFEED_REPLAY_LOOP=1 \
          MDFEED_RUN_DIR=/tmp/mdfeed \
          MDFEED_STORAGE_BACKEND=sqlite MDFEED_STORAGE_PROFILE=test \
          MDFEED_SQLITE_PATH=/tmp/mdfeed/smoke-cpp.db \
          PYTHONPATH=src python -m mdfeed.cli up > /tmp/stack.log 2>&1 &
          echo $! > /tmp/sup.pid
          sleep 15

      - name: 정말 C++ 가 도는지 확인 (파이썬으로 조용히 떨어지면 실패)
        run: |
          impl=$(curl -s --max-time 5 localhost:9111/healthz | python -c "import sys,json; print(json.load(sys.stdin).get('impl','python'))")
          echo "gateway impl = $impl"
          [ "$impl" = "c++" ] || { echo "::error::C++ 게이트웨이가 아니다 ($impl)"; tail -30 /tmp/stack.log; exit 1; }

      - name: 멀티캐스트 발행자도 같이 떴는지 · 전송 실패가 없는지
        # sendto 가 실패하면 프로세스는 살아 있는데 아무도 못 받는다. 가장 조용한 장애다.
        run: |
          h=$(curl -s --max-time 5 localhost:9132/healthz)
          echo "$h" | python -c "import sys,json; d=json.load(sys.stdin); print('mcast', d['service'], d['impl'], 'healthy=', d['healthy'], 'frames_in=', d['frames_in'], 'send_errors=', d['send_errors'])"
          echo "$h" | python -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['service'] == 'mcast-publisher' and d['healthy'], d
          assert d['frames_in'] > 0, '버스에서 프레임을 못 받았다'
          assert d['send_errors'] == 0, f'멀티캐스트 전송 실패 {d["send_errors"]}건 — 아무도 못 받는 상태'
          "

      - name: 헬스체크 (CRIT 이면 실패, 멀티캐스트 포함 8개 서비스)
        run: |
          set +e
          MDFEED_MCAST_ENABLED=1 PYTHONPATH=src python ops/healthcheck.py
          rc=$?
          set -e
          [ "$rc" -ge 2 ] && { tail -30 /tmp/stack.log; exit 1; }
          exit 0

      - name: 알람이 양방향으로 맞는지 (실재하지 않는 지표 · 아무도 안 보는 지표)
        run: PYTHONPATH=src python scripts/verify_alerts.py

      - name: 파이썬 참조 클라이언트로 구독 검증
        run: |
          PYTHONPATH=src timeout 30 python -m mdfeed.cli client --duration 10 --quiet | tee /tmp/client.log
          grep -q "데이터 무결성: 100" /tmp/client.log || {
            echo "::error::C++ 게이트웨이에서 구독자 데이터 무결성 100% 미달"; cat /tmp/client.log; exit 1; }

      - name: 종료
        if: always()
        run: kill "$(cat /tmp/sup.pid)" 2>/dev/null || true

  bench:
    name: 성능 벤치마크
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 벤치마크 실행
        run: python bench/latency_bench.py --quick --out /tmp/bench.json
        env: { PYTHONPATH: src }
      - name: 결과 요약
        run: |
          python - <<'PY'
          import json
          d = json.load(open("/tmp/bench.json"))
          print("| 항목 | 값 |"); print("|---|---|")
          print(f"| MDFP 인코딩 | {d['protocol']['encode_msg_per_s']:,} msg/s |")
          print(f"| MDFP 파싱 | {d['protocol']['parse_msg_per_s']:,} msg/s |")
          print(f"| 링버퍼 push | {d['ringbuffer']['push_msg_per_s']:,} msg/s |")
          print(f"| 버스 지연 p50 | {d['bus_latency']['latency_p50_us']} µs |")
          print(f"| 버스 처리량 | {d['bus_throughput']['throughput_msg_per_s']:,} msg/s |")
          print(f"| HTTP | {d['http']['req_per_s']:,} req/s |")
          PY
      - uses: actions/upload-artifact@v4
        with: { name: bench-result, path: /tmp/bench.json }

  docker:
    name: 컨테이너 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드
        run: docker build -t mdfeed:ci .
      - name: 컨테이너가 실제로 기동되는지
        run: |
          docker run -d --name mdfeed-ci -e MDFEED_ADAPTERS=replay \
            -e MDFEED_STORAGE_BACKEND=sqlite -e MDFEED_STORAGE_PROFILE=test \
            -e MDFEED_SQLITE_PATH=/tmp/mdfeed/docker-smoke.db \
            -v "$PWD/data/replay:/opt/mdfeed/data/replay:ro" \
            -p 9100:9100 mdfeed:ci
          for i in $(seq 1 20); do
            if curl -sf localhost:9100/healthz >/dev/null; then break; fi; sleep 2
          done
          curl -sf localhost:9100/healthz | python3 -m json.tool
          docker logs mdfeed-ci | tail -20
          docker rm -f mdfeed-ci

  cpp:
    name: C++ data plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - name: Build, unit-test, and cross-check against the Python implementation
        run: |
          make -C cpp -s all test
          PYTHONPATH=src python -m pytest tests/test_cpp_conformance.py tests/test_cpp_gateway.py tests/test_cpp_load_client.py tests/test_mcast.py tests/test_cpp_ringbuffer.py tests/test_entitlement_gateway.py -q -rs | tee pytest-cpp.log
          if grep -q "compiler not found" pytest-cpp.log; then echo "::error::conformance tests skipped"; exit 1; fi

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mdfeed_test
          # 로컬 일회용 런타임과 같은 trust 인증. 테스트가 역할별 DSN 을
          # 비밀번호 없이 만들어 쓰므로(_role_dsn) 비밀번호 인증이면 실패한다.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mdfeed_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U mdfeed_test -d mdfeed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install test dependencies
        run: pip install -e '.[postgres]' pytest
      - name: PostgreSQL storage tests
        # 스킵은 실패로 본다. 이 잡은 원래 TEST_POSTGRES_DSN 을 넘기기만 하고
        # 읽는 테스트가 없어서 전부 스킵된 채 초록불이었다.
        run: |
          set -o pipefail
          python -m pytest tests/test_postgres_storage.py tests/test_migration_postgres.py \
            tests/test_backup_postgres.py tests/test_storage_recovery_e2e.py -q -rs | tee pytest-pg.log
          if grep -q "PostgreSQL test runtime" pytest-pg.log; then
            echo "::error::PostgreSQL tests were skipped — the service container was not reached"
            exit 1
          fi
        env:
          PYTHONPATH: src
          TEST_POSTGRES_DSN: postgresql://mdfeed_test@127.0.0.1:55439/mdfeed_test
      - name: Upload sanitized logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-logs
          path: pytest-pg.log
