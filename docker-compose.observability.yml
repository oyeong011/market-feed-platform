# Prometheus + Grafana 관측 스택.
#
# 본 스택과 분리한 이유: 관측 도구가 죽어도 피드는 돌아야 한다.
# 반대로 피드를 재배포할 때 대시보드 이력이 날아가서도 안 된다.
#
# 호스트에서 직접 돌리는 서비스를 긁으므로 host.docker.internal 을 쓴다.
# 리눅스에서는 extra_hosts 로 매핑한다.

name: mdfeed-obs

services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [alertmanager]

  # **알람 전달 경로.** 이게 없으면 규칙 48개가 Prometheus 안에서 firing 이 되고
  # 거기서 끝난다 — UI 를 열어 보는 사람이 없으면 아무 일도 안 일어난다(결함 51).
  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - amdata:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    depends_on: [alert-sink]

  # 운영에서는 이 자리에 이메일·Slack·PagerDuty 가 온다. 개발 스택에는 그걸 붙일 수
  # 없으므로 **도착했는지 물어볼 수 있는 가장 작은 수신기**를 둔다. 표준 라이브러리만 쓴다.
  alert-sink:
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python3", "/app/alert_sink.py", "--port", "9140"]
    volumes:
      - ./ops/alert_sink.py:/app/alert_sink.py:ro
    ports: ["127.0.0.1:9140:9140"]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9140/healthz',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./ops/secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  promdata:
  grafanadata:
  amdata:
